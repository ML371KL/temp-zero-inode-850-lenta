[pytest]
testpaths = tests
pythonpath = .
# Системный temp этой машины недоступен на запись (виртуализация MSIX),
# поэтому временные каталоги тестов живут в var/ — он в .gitignore.
# Книга 1.0 в data/ (с 29.09.2026): тесты `needs_book` идут в общем наборе.
addopts = -q -m "not network" --basetemp=var/pytest-tmp
markers =
    tact: тест такта — БЕЛЫЙ СПИСОК проверок, которые ops/run.sh гоняет на сервере
        перед каждой сборкой (TACT_TESTS в ops/run.sh); тест без метки идёт только
        в CI и в полном прогоне. Цель — весь набор такта ≤ 3 минут на сервере
    network: тест ходит в сеть; в CI пропускается
    needs_book: тесту нужна книга допущений и факты в data/ (копия репозитория без
        книги); исключается ВЫРАЖЕНИЕМ -m, а не пропуском внутри теста
    docs: тест читает документ *.md репозитория; суточный такт их не гоняет
    ci_only: только CI, суточный такт (ops/run.sh, TACT_TESTS) не гоняет: полный
        выпуск с полосой (его собирает и проверяет сама сборка), статика витрины
        и functions/ (сверка витрины с кодом модели — в такте), CI-файлы,
        инструменты оператора, мощность мутационного набора. Сторож в
        tests/conftest.py
