    <script>
        App = {"page":{"lang":"ru","error":{"state":false,"type":null}},"components":{"regulatory-filings-detail":{"name":"События (действия), оказывающие, по мнению эмитента, существенное влияние на стоимость или котировки его ценных бумаг","date":1750932000,"detail":"<div style=\"word-break: break-word; word-wrap: break-word; white-space: pre-wrap;\">События (действия), оказывающие, по мнению эмитента, существенное влияние на стоимость или котировки его ценных бумаг<br><br>1. Общие сведения<br>1.1. Полное фирменное наименование (для коммерческой организации) или наименование (для некоммерческой организации) эмитента: Международная компания публичное акционерное общество \"Лента\"<br>1.2. Адрес эмитента, указанный в едином государственном реестре юридических лиц: 236006, Калининградская обл, г.о. город Калининград, г Калининград, б-р Солнечный, д. 25, помещ. В/66<br>1.3. Основной государственный регистрационный номер (ОГРН) эмитента (при наличии): 1213900001545<br>1.4. Идентификационный номер налогоплательщика (ИНН) эмитента (при наличии): 3906399157<br>1.5. Уникальный код эмитента, присвоенный Банком России: 16686-A<br>1.6. Адрес страницы в сети \"Интернет\", используемой эмитентом для раскрытия информации: https://www.e-disclosure.ru/portal/company.aspx?id=38380<br>1.7. Дата наступления события (существенного факта), о котором составлено сообщение: 26.06.2025<br><br>2. Содержание сообщения<br>Пресс-релиз | Санкт-Петербург | 26 июня 2025<br><br>«ЛЕНТА» ПРИОБРЕТАЕТ «МОЛНИЮ» – ОДНУ ИЗ КРУПНЕЙШИХ ТОРГОВЫХ СЕТЕЙ ЧЕЛЯБИНСКОЙ ОБЛАСТИ <br><br>Санкт-Петербург, Россия, 26 июня 2025 г.: МКПАО «Лента» (MOEX: LENT), ведущий мультиформатный продуктовый ретейлер России, сегодня объявляет о заключении соглашения о приобретении компании ООО «Молл» – одной из крупнейших розничных торговых сетей в Челябинской области.<br><br>Периметр сделки<br>В периметр сделки войдут 5 гипермаркетов, 18 супермаркетов и 49 магазинов у дома под брендом «Spar». В сделку также включены три распределительных центра, обеспечивающих оперативное снабжение сети. Сумма сделки не раскрывается. <br><br>Стратегическое обоснование<br>Данная сделка – важный шаг в рамках стратегии дальнейшей трансформации «Ленты» в мультиформатного игрока на российском рынке. В результате приобретения «Лента» усилит свои позиции на Центральном Урале, где ООО «Молл» занимает пятое место по объему выручки среди ретейлеров региона. Компания управляет 72 магазинами в трех форматах: гипермаркеты, супермаркеты и магазины у дома, в каждом из которых «Лента» видит перспективы для дальнейшего развития и потенциал для роста рентабельности. Приобретение позволит «Ленте» ускорить достижение цели — достичь выручки 1 трлн рублей к концу 2025 года. <br><br>Интеграция и закрытие сделки<br>Магазины «Молнии» перейдут под управление соответствующих форматов «Ленты». При этом будет сохранён существующий персонал, который продолжит применять свои лучшие практики работы в регионе. Кроме того, ожидается, что интеграция распределительных центров с логистической инфраструктурой «Ленты» повысит эффективность доставки и снизит затраты, что создаст дополнительные возможности по уменьшению цен для конечного потребителя. «Лента» начнёт консолидировать приобретённый бизнес в своей отчётности с текущей даты.<br>Федеральная антимонопольная служба России уже одобрила данное приобретение, которое будет финансироваться за счёт собственных средств «Ленты». <br><br>О «Молнии»<br>«Молния» – продовольственная сеть с исторически качественным портфелем из 72 магазинов в зонах с высокой проходимостью как в самом Челябинске, так и в других ключевых городах области. С 1998 года, она успешно привлекает местных покупателей благодаря высокому уровню сервиса, наличию локального ассортимента и удобному формату размещения магазинов. За 2024 год общая выручка «Молнии» составила 20,6 млрд руб. при торговой площади сети более 60 000 кв. м. На момент сделки все магазины находятся в аренде.<br><br>За более детальной информацией, пожалуйста, обращайтесь:<br>КОНТАКТ-ЗАГЛУШКА, директор по связям с инвесторами<br>[почта-заглушка]<br><br>О Компании<br>МКПАО «Лента» (MOEX: LENT) — ведущий многоформатный продуктовый и FMCG ретейлер в России. Компания развивает форматы гипермаркетов, супермаркетов, магазинов у дома и дрогери. «Лента» также предоставляет покупателям возможность совершать покупки онлайн, используя собственные сервисы и сервисы онлайн-партнёров. «Лента» является крупнейшей сетью гипермаркетов в России и четвёртой среди крупнейших продуктовых ретейлеров страны по выручке. Компания была основана в 1993 году в Санкт-Петербурге. По состоянию на 31 марта 2025 года под управлением «Ленты» находится 263 гипермаркета, 319 супермаркетов, 3 106 магазина у дома и 1 720 магазина в формате «Дрогери» общей торговой площадью свыше 2,6 млн кв. м. в более чем 650 населённых пунктах России. Средняя торговая площадь одного гипермаркета «Ленты» составляет около 5 170 кв. м., супермаркета — 740 кв. м., магазина у дома — 270 кв. м., дрогери — 130 кв.м. Компания располагает 22 распределительными центрами по всей России. В 2024 году выручка «Ленты» составила 888 млрд руб.<br><br>Заявления прогнозного характера<br>Этот документ содержит заявления, которые являются или могут считаться «прогнозными заявлениями». Эти прогнозные заявления можно определить по тому факту, что они не относятся только к прошедшим или настоящим событиям. Эти прогнозные заявления можно определить по использованию таких слов, как «ожидает», «планирует», «оценивает», «намеревается», «рассчитывает», «намечает», «предполагает» и других аналогичных слов. По своему характеру прогнозные заявления связаны с риском и неопределённостью, так как относятся к событиям и обстоятельствам, которые ещё не произошли и неподвластны контролю со стороны Компании. Как итог, реальные результаты в будущем могут существенно отличаться от запланированных, намеченных и ожидаемых результатов, указанных в наших прогнозных заявлениях. Все прогнозные заявления, сделанные Компанией или от её имени, актуальны только на дату сделанного соответствующего заявления. За исключением случаев, прямо предусмотренных соответствующим законодательством или регуляторными нормами, «Лента» не принимает на себя обязательства по распространению или публикации любых изменений в прогнозных заявлениях, содержащихся в данном документе, с целью отражения каких-либо изменений ожиданий Компании касательно этих вопросов или любых изменений событий, условий или обстоятельств, на которых основывается любое такое прогнозное заявление, после даты публикации данного документа.<br><br>3. Подпись<br>3.1. Генеральный Директор<br>ПОДПИСАНТ-ЗАГЛУШКА<br><br>3.2. Дата 26.06.2025г.</div>","pdf":"https://storage.zds.zebra-group.ru/data/12/1/6003b28e3a3c35fd4b9c879679d56c9a.pdf","back-link":"/ru/investors/regulatory-filings/"}}};
