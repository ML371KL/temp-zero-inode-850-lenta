    <script>
        App = {"page":{"lang":"ru","error":{"state":false,"type":null}},"components":{"regulatory-filings-detail":{"name":"События (действия), оказывающие, по мнению эмитента, существенное влияние на стоимость или котировки его ценных бумаг","date":1761894000,"detail":"<div style=\"word-break: break-word; word-wrap: break-word; white-space: pre-wrap;\">События (действия), оказывающие, по мнению эмитента, существенное влияние на стоимость или котировки его ценных бумаг<br><br>1. Общие сведения<br>1.1. Полное фирменное наименование (для коммерческой организации) или наименование (для некоммерческой организации) эмитента: Международная компания публичное акционерное общество \"Лента\"<br>1.2. Адрес эмитента, указанный в едином государственном реестре юридических лиц: 236006, Калининградская обл, г.о. город Калининград, г Калининград, б-р Солнечный, д. 25, помещ. В/66<br>1.3. Основной государственный регистрационный номер (ОГРН) эмитента (при наличии): 1213900001545<br>1.4. Идентификационный номер налогоплательщика (ИНН) эмитента (при наличии): 3906399157<br>1.5. Уникальный код эмитента, присвоенный Банком России: 16686-A<br>1.6. Адрес страницы в сети \"Интернет\", используемой эмитентом для раскрытия информации: https://www.e-disclosure.ru/portal/company.aspx?id=38380<br>1.7. Дата наступления события (существенного факта), о котором составлено сообщение: 31.10.2025<br><br>2. Содержание сообщения<br>2.1. Краткое описание события (действия), наступление (совершение) которого, по мнению эмитента, оказывает влияние на стоимость или котировки его ценных бумаг: публикация пресс-релиза: <br>«Группа Лента» объявляет о росте выручки на 26,8% в 3 квартале 2025 года; Рентабельность EBITDA составила 7,3% <br> МКПАО «Лента» (MOEX: LENT), одна из крупнейших розничных сетей России, сегодня объявляет ключевые операционные и финансовые результаты за третий квартал и девять месяцев 2025 года.<br><br>Основные результаты за 3 квартал 2025 года1,2<br>    •\tВыручка выросла на 26,8% год к году до 267,5 млрд руб.<br>    •\tРозничные продажи составили 264,8 млрд руб., увеличившись на 26,5% год к году.<br>    •\tСопоставимые продажи (LFL) выросли на 10,4% на фоне роста LFL-среднего чека на 11,1%.<br>    •\tОбщая торговая площадь увеличилась на 21,0% год к году и составила 2 879 тыс. кв. м на фоне открытий преимущественно в формате магазинов у дома, а также приобретения сетей «Улыбка Радуги» и «Молния». <br>    •\tОнлайн-продажи выросли на 26,7% год к году до 16,9 млрд руб., при этом рост собственных сервисов составил 66,3%.<br>    •\tГруппа открыла (с учетом закрытий) 301 магазин у дома, 9 супермаркетов, 1 гипермаркет и 110 магазинов дрогери.<br>    •\tВаловая прибыль выросла на 32,6% год к году и составила 61,3 млрд руб. Валовая рентабельность увеличилась на 101 б.п. до 22,9%. <br>    •\tПоказатель EBITDA составил 19,6 млрд руб., увеличившись на 15,5%. Рентабельность EBITDA снизилась на 72 б.п. и составила 7,3%.<br> <br>Основные результаты за 9 месяцев 2025 года1,2<br>    •\tВыручка увеличилась на 25,1% год к году до 781,4 млрд руб.<br>    •\tРозничные продажи составили 773,8 млрд руб., увеличившись на 25,0% год к году.<br>    •\tСопоставимые продажи (LFL) увеличились на 11,6% в результате роста LFL-среднего чека на 10,2% и LFL-трафика на 1,3%.<br>    •\tОнлайн-продажи увеличились на 15,4% год к году до 52,9 млрд руб., при этом выручка собственных сервисов увеличилась на 56,4%.<br>    •\tГруппа открыла (с учетом закрытий и приобретения сети «Молния») 807 магазинов у дома, 5 гипермаркетов, 42 супермаркета и 245 магазинов дрогери.<br>    •\tВаловая прибыль увеличилась на 31,0% год к году и составила 177,6 млрд руб. Валовая рентабельность увеличилась на 102 б.п. до 22,7%.<br>    •\tПоказатель EBITDA составил 58,1 млрд руб., увеличившись на 24,5%. Рентабельность EBITDA незначительно снизилась на 4 б.п. и составила 7,4%. <br>    •\tСоотношение чистого долга к EBITDA (за последние 12 месяцев) составило 0,9x на 30 сентября 2025 года, не изменившись по сравнению с 0,9x на конец 2024 года. <br><br>1.\tОбратите внимание, что все финансовые показатели в этом разделе основаны на данных до применения IFRS-16.<br>2.\tСопоставимые результаты (LFL) «Группы Лента» не учитывают результаты магазинов «Улыбка радуги» и «Молния». <br><br>Адреса страниц в сети Интернет, на которых опубликован пресс-релиз: <br>https://www.e-disclosure.ru/portal/files.aspx?id=38380&type=10 <br>https://corp.lenta.com/ru/investors/publications/#tabs-results». <br>2.2. Полное фирменное наименование (для коммерческой организации) или наименование (для некоммерческих организаций), место нахождения, идентификационный номер налогоплательщика (ИНН) (при наличии), основной государственный регистрационный номер (ОГРН) (при наличии) или фамилия, имя, отчество (при наличии) указанного лица, в случае если событие (действие) имеет отношение к третьему лицу: не применимо; <br>2.3. Наименование уполномоченного органа управления (уполномоченного должностного лица), дата принятия и содержание принятого решения, а если решение принято коллегиальным органом управления эмитента или третьего лица - также дата составления и номер протокола собрания (заседания) уполномоченного коллегиального органа управления эмитента или третьего лица, в случае если событие (действие) имеет отношение к решению, принятому уполномоченным органом управления (уполномоченным должностным лицом) эмитента или третьего лица: не применимо; <br>2.4. Идентификационные признаки ценных бумаг: вид ценных бумаг (акции, облигации, опционы эмитента, российские депозитарные расписки), категория (тип) - для акций, серия ценных бумаг (при наличии), регистрационный номер выпуска (дополнительного выпуска) ценных бумаг (программы облигаций) и дата его (ее) регистрации (идентификационный номер выпуска (дополнительного выпуска) ценных бумаг и дата его присвоения), международный код (номер) идентификации ценных бумаг (ISIN) (при наличии), международный код классификации финансовых инструментов (CFI) (при наличии), а также иные идентификационные признаки ценных бумаг, указанные их эмитентом в решении о выпуске ценных бумаг, в случае если событие (действие) может оказать существенное влияние на стоимость или котировки ценных бумаг эмитента: акции обыкновенные: государственный регистрационный № 1-01-16686-A от 08.02.2021г., международный код (номер) идентификации ценных бумаг (ISIN): RU000A102S15; <br>2.5. Дата наступления события (совершения действия), а если событие наступает в отношении третьего лица (действие совершается третьим лицом) - также дата, в которую эмитент узнал или должен был узнать о наступлении события (совершении действия): 31 октября 2025 года.<br><br>3. Подпись<br>3.1. Генеральный Директор<br>ПОДПИСАНТ-ЗАГЛУШКА<br><br>3.2. Дата 31.10.2025г.<div>","pdf":"https://storage.zds.zebra-group.ru/data/12/1/8174d9b8b1bc5326c16ef5b984d87218.pdf","back-link":"/ru/investors/regulatory-filings/"}}};
