# Справочные наборы таблиц книги «Ленты» (`model/book_results.py::results_spec`).
#
# Это НЕ суждения книги (их нет в assumptions.yaml и они не двигают оценку) и
# не код, а входы проверок и справок таблиц `results.json`. Записаны до
# первого прогона ядра на книге 1.0 (29.09.2026), под числа не подбирались.
# Единицы: маржа и вероятности — доли единицы.

# Контрольные наборы наблюдений правила A-P2u — тест-векторы реализации правила
# (печать `run_output.txt`, блок `regime_update_controls`). Полугодие отчёта —
# `joint.regime_update.demo_period` (2026H2); у «Ленты» 2П сильнее 1П (сезонность
# `margin.seasonal_h1_pp` < 0), поэтому пары 2П/1П идут с 1П ниже 2П.
# Наблюдение — число (факт, se = 0) или {value, se} (прогноз со своей ошибкой).
control_cases:
  - label: "нет наблюдений"
    observations: {}
  - label: "прогноз 2П2026 = 6,2 % со ст. ошибкой 0,3 п.п."
    observations: {"2026H2": {value: 0.062, se: 0.003}}
  - label: "прогноз 2П2026 = 6,2 % со ст. ошибкой 1,0 п.п. (слабый)"
    observations: {"2026H2": {value: 0.062, se: 0.010}}
  - label: "факты 2П2026 = 5,8 % и 1П2027 = 5,4 %"
    observations: {"2026H2": 0.058, "2027H1": 0.054}
  - label: "факты 2П2026 = 7,0 % и 1П2027 = 6,6 %"
    observations: {"2026H2": 0.070, "2027H1": 0.066}
  - label: "факты 2П2026 = 6,2 % и 2П2027 = 6,8 % (пропуск периода)"
    observations: {"2026H2": 0.062, "2027H2": 0.068}

# Строки «что оправдывает рыночную цену»: конец строки чувствительности книги
# (`sensitivities`, поле `row` — имя строки), который двигает точку при
# центральных значениях К РЫНКУ. Направление выбирает расчёт по знаку разрыва
# «точка − рынок»: у «Ленты» точка выше рынка, и это нижние концы.
justification_ends:
  - {name: "A-C0 долгосрочный уровень маржи", row: "A-C0 Долгосрочный уровень маржи (цели LT всех режимов)"}
  - {name: "A-P2 вероятности режимов", row: "A-P2 Вероятности режимов: только класс эпизодов / только класс интеграций"}
  - {name: "A-K1 поддерживающий capex, сдвиг траектории", row: "A-K1 Поддерживающий capex, сдвиг базовой траектории"}
  - {name: "A-R7 темп открытий «у дома»", row: "A-R7 Темп открытий «у дома» (множитель)"}
  - {name: "A-V1 бета активов", row: "A-V1 Бета активов"}
  - {name: "A-V2 ERP", row: "A-V2 ERP"}
  - {name: "A-V7 дисконт за управление", row: "A-V7 Дисконт за корпоративное управление"}

# Справочная безусловная P(полная сходимость) — строка «что оправдывает цену»:
# «полный» режим во всех мирах умножается на один коэффициент, масса
# снимается с остальных режимов пропорционально
# (`regime_table_with_full`). У «Ленты» точка выше рынка, поэтому справка —
# граница к рынку: полная сходимость не случается.
full_return_reference:
  name: "A-P2 P(полная сходимость), безусловная"
  value: 0.0
  note: "полная сходимость исключена, масса — остальным режимам пропорционально"

# Справочные таблицы P(режим | мир) — строки «что оправдывает цену» с именем,
# подписью значения и таблицей ({name, value_label, table, note}). У «Ленты»
# отменённых таблиц прежних версий нет, а края класса эпизодов и класса
# интеграций — строка чувствительности A-P2 (выше), поэтому список пуст.
reference_regime_tables: []
