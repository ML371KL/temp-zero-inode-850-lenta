# Прогулка книги 1.1 → 1.2: правки по одной, накопительно (ops/tools/walk_book.py).
# Суждения, факты, цена и мост не меняются: версия 1.2 — миры ставок после решения Банка России 23.10.2026
# (запись миров 28.10.2026). Шаг «миры ставок» разложен на два подшага по мирам: мир M — рынок (окно 23–28.10.2026)
# и текущее полугодие ЦБ; миры N и H — правила и входы ЦБ (прогноз 23.10, итоговая ОНДКП 28.10, опрос 14.10).
# Дата кривых (meta.curve_as_of) идёт с миром M: на входах книги (дата оценки 18.09 раньше даты кривых) переката нет.
- name: "Версия 1.2 (номер версии, чисел не меняет)"
  from_end: [meta.version]
- name: "Миры ставок (ЦБ 23.10.2026), мир M: рынок окна 23–28.10.2026 и дата кривых 28.10"
  from_end: [worlds.M, meta.curve_as_of]
- name: "Миры ставок (ЦБ 23.10.2026), миры N и H: прогноз ЦБ 23.10, итоговая ОНДКП 28.10, опрос 14.10, факт 2П2026"
  from_end: [worlds.N, worlds.H]
