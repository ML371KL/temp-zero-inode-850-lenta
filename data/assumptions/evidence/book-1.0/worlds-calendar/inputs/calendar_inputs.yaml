# Входы календаря событий «Ленты» (build_calendar.py). Даты отчётов эмитента и пут-оферты облигаций скрипт считает сам
# из первички (индекс пресс-релизов lentagroup.ru, ISS bondization); здесь — правило окон, подписи и события без первички
# в каталоге (ЦБ, законы, окна по расчёту) — у каждого источник и надёжность.
# Точность (precision): day — дата объявлена эмитентом/биржей/законом; month — известен месяц; window — окно (from–to),
# when — центральная оценка или срок (when_rule); year — известен только год. Выдуманная точная дата хуже честного окна.
as_of: "2026-09-28"

report_rule:                        # окна отчётов эмитента по лагам прошлых лет (дни от конца периода до релиза)
  history_years: 2                  # последние два года того же типа отчёта (с 2023 опер. и фин. итоги Q1–Q3 выходят одним релизом)
  window_before_days: 2             # окно = [конец + min(лаг) − 2; конец + max(лаг) + 3]
  window_after_days: 3
  central: floor_mean               # центр = конец + ⌊среднее лагов⌋; выходной → предыдущая пятница
  weekend_to: previous_friday

# история релизов: период, тип, дата — скрипт находит каждую строку в индексе новостей по дате и признаку в заголовке
report_history:
  - {period: "2023Q1", kind: q,      date: "2023-04-24", title_has: "1 квартал 2023"}
  - {period: "2023Q2", kind: q,      date: "2023-07-28", title_has: "2 квартал"}
  - {period: "2023Q3", kind: q,      date: "2023-10-23", title_has: "3 квартале 2023"}
  - {period: "2023Q4", kind: q4_ops, date: "2024-02-05", title_has: "4 квартале 2023"}
  - {period: "2023FY", kind: fy,     date: "2024-03-21", title_has: "4 квартале 2023"}
  - {period: "2024Q1", kind: q,      date: "2024-04-26", title_has: "1 квартале 2024"}
  - {period: "2024Q2", kind: q,      date: "2024-07-29", title_has: "2 квартале 2024"}
  - {period: "2024Q3", kind: q,      date: "2024-10-28", title_has: "3 квартале 2024"}
  - {period: "2024Q4", kind: q4_ops, date: "2025-02-05", title_has: "4 квартале 2024"}
  - {period: "2024FY", kind: fy,     date: "2025-03-26", title_has: "4 квартале 2024"}
  - {period: "2025Q1", kind: q,      date: "2025-04-28", title_has: "1 квартале 2025"}
  - {period: "2025Q2", kind: q,      date: "2025-07-31", title_has: "2 квартале 2025"}
  - {period: "2025Q3", kind: q,      date: "2025-10-31", title_has: "3 квартале 2025"}
  - {period: "2025Q4", kind: q4_ops, date: "2026-02-09", title_has: "4 квартале 2025"}
  - {period: "2025FY", kind: fy,     date: "2026-03-26", title_has: "4 квартале 2025"}
  - {period: "2026Q1", kind: q,      date: "2026-04-30", title_has: "1 квартале 2026"}
  - {period: "2026Q2", kind: q,      date: "2026-08-03", title_has: "2 квартале 2026"}

# будущие отчёты эмитента: id = <префикс эмитента>.<отчёт> (контракт журнала: 2026H2/2026FY → lenta.fy2026, 2027H1 → lenta.h1_2027;
# кварталы — lenta.q3_2026, lenta.q1_2027; выручка 4 кв. — lenta.q4_2026_ops, маржа 4 кв. — lenta.fy2026)
reports:
  - id: lenta.q3_2026
    period: "2026Q3"
    kind: q
    title: "Лента: операционные и финансовые результаты 3 кв. и 9 мес. 2026 (пресс-релиз, датабук)"
    gives: [revenue, ebitda_margin_pre16, lfl_ticket, lfl_traffic, net_debt, selling_space, stores]
    note: "ФАКТ квартала: ближайший отчёт и первая точка нау-каста lenta-margin-v1 и журнала (D2, D15). Маржа 3 кв. — в зачёт журнала и в экран «какая маржа 2П следует из факта 3 кв.»; в правило A-P2u идёт полугодие 2026H2 (годовой отчёт). МСФО за 9 мес. группа не публикует. Первый квартал с «О'КЕЙ» целиком (во 2 кв. — только июнь): эталон «г/г + сдвиг прошлого квартала» — с поправкой на периметр. Релизы с 31.10.2025 выходят в 10:00 МСК — вечерний такт daily их видит."
  - id: lenta.q4_2026_ops
    period: "2026Q4"
    kind: q4_ops
    title: "Лента: операционные результаты 4 кв. и 2026 года (выручка, LFL, площадь)"
    gives: [revenue, lfl_ticket, lfl_traffic, selling_space, stores]
    note: "ФАКТ выручки 4 кв. без маржи: первое из двух событий 4 кв. в журнале (D2); маржа 4 кв. и 2П2026 — в годовом отчёте."
  - id: lenta.fy2026
    period: "2026FY"
    kind: fy
    title: "Лента: финансовые результаты 4 кв. и 2026 года (МСФО 12М, аудит; пресс-релиз и датабук)"
    gives: [revenue, ebitda_margin_pre16, net_interest, net_debt, capex, nwc, tax]
    note: "ФАКТ 2П2026 (2П = год − 1П): наблюдение правила A-P2u, маржа 4 кв. в журнале, перезаякоривание книги на 31.12.2026 (D2). Аудиторское заключение МСФО датировано на 1–2 дня раньше релиза (FY2025 — 24.03 против 26.03.2026; FY2024 — 25.03 против 26.03.2025; MANIFEST), дата подачи на e-disclosure в каталоге не установлена; EBITDA до МСФО 16 — только в релизе и датабуке."
  - id: lenta.q1_2027
    period: "2027Q1"
    kind: q
    title: "Лента: операционные и финансовые результаты 1 кв. 2027"
    gives: [revenue, ebitda_margin_pre16, lfl_ticket, lfl_traffic, net_debt, selling_space, stores]
    note: "ФАКТ квартала. «О'КЕЙ» в базе прошлого года нет — эталоны журнала с поправкой на периметр (кварталы 3 кв. 2026 – 2 кв. 2027, D15)."
  - id: lenta.h1_2027
    period: "2027Q2"
    kind: q
    title: "Лента: результаты 2 кв. и 1П2027 (МСФО 6М, обзор; пресс-релиз и датабук)"
    gives: [revenue, ebitda_margin_pre16, net_interest, net_debt, capex, nwc, tax]
    note: "ФАКТ 2027H1: наблюдение A-P2u и перезаякоривание на 30.06.2027 (D2); последний квартал с поправкой эталона на периметр (во 2 кв. 2026 «О'КЕЙ» — один месяц). Обзорное заключение МСФО 6М датировано на 2–3 дня раньше релиза (6М2026 — 31.07 против 03.08.2026; 6М2025 — 29.07 против 31.07.2025; MANIFEST)."

# облигации «О'КЕЙ» под пут-офертами — даты скрипт берёт из ISS bondization (offers, тип «Оферта», дата ≥ as_of)
bond_puts:
  - {isin: "RU000A10CCN3", id: okey.bond_b1p8_put, basket: "okey_bonds_put_2027"}
  - {isin: "RU000A1084E6", id: okey.bond_b1p6_put, basket: "okey_bonds_put_2027"}

# события без первички в каталоге: у каждого source (где взято) и reliability (A — первоисточник, B — вторичный/расчёт, C — суждение)
events:
  - id: cbr.key_rate.2026-10-23
    when: "2026-10-23"
    precision: day
    when_rule: exact
    title: "ЦБ: опорное заседание по ключевой ставке и новый среднесрочный прогноз"
    gives: [key_rate, cbr_forecast]
    prior_for: "worlds_source.json"
    source: "cbr.ru/dkp/cal_mp/ — календарь решений 2026 (прочитан 28.09.2026): опорные 13.02, 24.04, 24.07, 23.10.2026"
    reliability: A
    note: "Повод общей пересборки миров обеих книг (D6): вечером дня заседания — кандидат refresh_worlds.py на кривой и ОФЗ-ИН дня торгов, новые входы записи (прогноз ЦБ, итог ОНДКП, макроопрос), подпись на следующий день; для «Ленты» это новая версия книги (1.1), не правка 1.0. До пересборки выпуск подписан «миры записи 18.09.2026». Плавающая доля долга «Ленты» 26 % — прямой канал в процентах."
  - id: cbr.summary.2026-11-05
    when: "2026-11-05"
    precision: day
    when_rule: exact
    title: "ЦБ: резюме обсуждения ключевой ставки и комментарий к среднесрочному прогнозу"
    gives: [cbr_forecast]
    prior_for: "worlds_inputs.yaml"
    source: "cbr.ru/dkp/cal_mp/ (28.09.2026); ОНДКП 2027–2029, проект 31.08.2026, раздел 5: в опорные раунды комментарий к прогнозу выходит вместе с резюме"
    reliability: A
    note: "Детали прогноза (сценарии, предпосылки) — входы записи миров; если пересборка сделана вечером 23.10 по пресс-релизу, сверить входы с комментарием."
  - id: cbr.key_rate.2026-12-18
    when: "2026-12-18"
    precision: day
    when_rule: exact
    title: "ЦБ: заседание по ключевой ставке (не опорное)"
    gives: [key_rate]
    prior_for: "lenta.net_interest"
    source: "cbr.ru/dkp/cal_mp/ (28.09.2026)"
    reliability: A
    note: "Без нового прогноза: миры не пересобираются, если кривая не сдвинулась ≥ 50 б.п. на 5–10 годах (гейт book_update)."
  - id: cbr.key_rate.2027-02
    when: "2027-02-12"
    precision: month
    when_rule: central
    window: {from: "2027-02-01", to: "2027-02-28"}
    title: "ЦБ: опорное заседание (февраль 2027)"
    gives: [key_rate, cbr_forecast]
    prior_for: "worlds_source.json"
    source: "ОНДКП 2027–2029, проект 31.08.2026: 8 заседаний в год по пятницам, опорные — февраль, апрель, июль, октябрь; календарь 2027 на cbr.ru на 28.09.2026 не опубликован; дата — пятница той же недели, что 13.02.2026 (расчёт)"
    reliability: B
    note: "С 2027 г. ЦБ планирует вводить новую ставку со среды после заседания, а не с понедельника (ОНДКП, раздел 4). Заменить датой календаря ЦБ, когда он выйдет."
  - id: cbr.key_rate.2027-04
    when: "2027-04-23"
    precision: month
    when_rule: central
    window: {from: "2027-04-01", to: "2027-04-30"}
    title: "ЦБ: опорное заседание (апрель 2027)"
    gives: [key_rate, cbr_forecast]
    prior_for: "worlds_source.json"
    source: "как у февральского; дата — пятница той же недели, что 24.04.2026 (расчёт)"
    reliability: B
    note: "Повод пересборки миров."
  - id: cbr.key_rate.2027-07
    when: "2027-07-23"
    precision: month
    when_rule: central
    window: {from: "2027-07-01", to: "2027-07-31"}
    title: "ЦБ: опорное заседание (июль 2027)"
    gives: [key_rate, cbr_forecast]
    prior_for: "worlds_source.json"
    source: "как у февральского; дата — пятница той же недели, что 24.07.2026 (расчёт)"
    reliability: B
    note: "Повод пересборки миров."
  - id: cbr.key_rate.2027-10
    when: "2027-10-22"
    precision: month
    when_rule: central
    window: {from: "2027-10-01", to: "2027-10-31"}
    title: "ЦБ: опорное заседание (октябрь 2027)"
    gives: [key_rate, cbr_forecast]
    prior_for: "worlds_source.json"
    source: "как у февральского; дата — пятница той же недели, что 23.10.2026 (расчёт)"
    reliability: B
    note: "Повод пересборки миров."
  - id: cbr.ondkp_2027_final
    when: "2026-12-01"
    precision: window
    when_rule: deadline
    window: {from: "2026-10-23", to: "2026-12-01"}
    title: "ЦБ: итоговые Основные направления ДКП 2027–2029 (сценарии)"
    gives: [cbr_scenarios]
    prior_for: "worlds_inputs.yaml"
    source: "research/07 §1.4 (итог — после октябрьского заседания); срок «не позднее 1 декабря» — ст. 45 закона о ЦБ (в этой сессии текст закона не открывался)"
    reliability: B
    note: "Входы миров H и рискового сценария: в записи проинфляционный сценарий занесён только по ключевой 2027–2028, 2029 и инфляция сценария — пробел записи (research/07 §1.4); рисковый — кандидат в четвёртый мир (решение при пересборке)."
  - id: budget.law_2027_2029
    when: "2026-11-30"
    precision: month
    when_rule: central
    window: {from: "2026-11-01", to: "2026-12-31"}
    title: "Федеральный бюджет 2027–2029: закон"
    gives: [fiscal]
    prior_for: "worlds_inputs.yaml"
    source: "research/07 §7, §9 (проект внесён 24.09.2026: дефицит ≈2 % ВВП в год, отсечка $50; подписание — ориентир конец ноября)"
    reliability: B
    note: "Ястребиный риск для миров: июльский прогноз ЦБ исходил из снижения структурного дефицита до 0 к 2029; ЦБ предупредил, что больший дефицит потребует более жёсткой ДКП."
  - id: mrot.2027_law
