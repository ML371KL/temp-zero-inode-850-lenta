    precision: month
    when_rule: central
    window: {from: "2026-11-01", to: "2026-12-31"}
    title: "МРОТ на 2027 год: федеральный закон"
    gives: [wage_floor]
    prior_for: "lenta.ebitda_margin_pre16"
    source: "research/07 §4.3: 28 935 ₽ (+6,8 %) — Минфин на заседании правительства 24.09.2026, в составе бюджетного пакета (e1.ru, вторичный); закон не принят"
    reliability: B
    note: "Детерминированный вход: после подписания величина известна точно. После +20,7 % в 2026 рост пола зарплатной сетки в 2027 ≈ инфляция + 2–3 п.п.; доля персонала на уровне МРОТ выше у «Монетки» и в регионах."
  - id: mrot.2027_effective
    when: "2027-01-01"
    precision: day
    when_rule: exact
    title: "МРОТ 2027 вступает в силу"
    gives: [wage_floor]
    prior_for: "lenta.ebitda_margin_pre16"
    source: "МРОТ устанавливается федеральным законом с 1 января года (закон о МРОТ, ст. 1); величина — mrot.2027_law"
    reliability: A
    note: "Детерминированный вход: давит на маржу 1 кв. 2027 (сезонно слабый квартал у «Ленты»)."
  - id: law.price_monitoring_2027
    when: "2027-01-01"
    precision: day
    when_rule: exact
    title: "Закон о мониторинге цен по всей цепочке (поправки в закон «О торговле») вступает в силу"
    gives: [regulation]
    prior_for: "joint.regime_given_world"
    source: "research/07 §5: подписан 04.08.2026, в силе с 01.01.2027 (pravo.ru, вторичный; номер закона в источниках не назван); перечень 24 видов продуктов — проект постановления Минпромторга, сентябрь 2026"
    reliability: B
    note: "Детерминированный вход без прямого денежного эффекта: ФНС передаёт ведомствам цены, объёмы и прибыль участников — инструмент для регулирования наценок. Хвост режима «стресс» (D6, D9): законопроект № 1187519-8 о наценке ≤ 10 % на социально значимые товары внесён (≈март 2026), не рассмотрен — даты нет, в списке наблюдения."
  - id: tariffs.2026_10
    when: "2026-10-01"
    precision: day
    when_rule: exact
    title: "Индексация коммунальных тарифов (второй этап 2026 года)"
    gives: [utilities]
    prior_for: "lenta.ebitda_margin_pre16"
    source: "ОНДКП 2027–2029, проект 31.08.2026, приложение, с. 147: в 2026 г. индексация в два этапа — январь +1,7 %, октябрь в среднем +15,0 % (оценка ЦБ по параметрам регионов); в записи миров tariff_growth 2026H2 = 9,9 % (Минэк, вторичный)"
    reliability: A
    note: "Детерминированный вход. Код оценки тарифы не читает (миры, раздел 1); у «Ленты» 34 % площади в собственности — строка тарифов рабочая в листе маржи (М11). Расхождение 15,0 против 9,9 % — в журнал входов к пересборке миров."
  - id: lenta.remi_put_window
    when: "2027-06-30"
    precision: window
    when_rule: deadline
    window: {from: "2027-01-01", to: "2027-06-30"}
    title: "Пут на 33 % «Реми» (ООО «Продукт-Эконом»): окно исполнения"
    gives: [claim_settlement]
    prior_for: "bridge.items[remi_put]"
