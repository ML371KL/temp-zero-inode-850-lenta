    reliability: B
    note: "5,214 млрд на 30.06.2026, размотка 9,40 % за полугодие → ≈5,70 млрд к началу 2027H1; в модели — строка моста с settle_period 2027H1 (платёж выводится из строки, D13). Событие ловит лента раскрытия (сущфакт о выкупе доли)."
  - id: lenta.dividends_first
    when: "2028-01-01"
    precision: year
    when_rule: earliest
    window: {from: "2028-01-01", to: "2028-12-31"}
    title: "Лента: первые дивиденды возможны (слова финдиректора)"
    gives: [dividend]
    prior_for: "financing.dividends_from_year"
    source: "Ведомости 28.11.2025 (звонок по стратегии-2028, объявлен релизом 27.11.2025 — lentagroup_news/2025-11-27_*): «первые дивиденды возможны в 2028 году»; положение о дивидендной политике 2021 (lenta_dividend_policy_2021_ru.pdf): лестница по ЧД/EBITDA до МСФО 16"
    reliability: B
    note: "В APV дивиденды влияют на стоимость только через щит (цена ошибки года ≈0); на витрине — ступень лестницы и год по модели (D16). Решение — совет директоров/ГОСА; ранний сигнал — повестка СД в ленте раскрытия."
  - id: moex.index_base_2026-12
