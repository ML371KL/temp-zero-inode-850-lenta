    gives: [listing_index]
    prior_for: "valuation.governance_discount"
    source: "research/05 [S6]: базы индексов меняются в третью пятницу последнего месяца квартала (20.03.2026 — включение LENT в IMOEX, анонс 27.02; 18.09.2026 — исключение, анонс 04.09) → 18.12.2026, анонс ≈04.12 (расчёт по правилу)"
    reliability: B
    note: "LENT исключена из IMOEX с 18.09.2026 после перевода в третий уровень листинга (12.08.2026); возврат без возврата в котировальный список маловероятен. Смена уровня листинга (moex_security, LISTLEVEL) — плашка и гейт «пересмотреть g» (D15)."
  - id: x5.q3_2026
    when: "2026-10-30"
    precision: month
    when_rule: central
