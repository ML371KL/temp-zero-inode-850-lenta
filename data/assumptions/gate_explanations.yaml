# Письменные объяснения сработавших гейтов правдоподобия — книга 1.0 «Ленты».
#
# Правило 850oa без изменений: гейт — не ошибка, а место, где модель расходится с историей или рынком;
# расходиться можно, не замечать — нельзя. Пока у сработавшего гейта нет записи здесь, сборка выпуска падает.
# Формат: ключ гейта → explanation (текст для владельца), expected_mass (доля вероятностной массы сетки,
# на которой гейт срабатывает; у дрейфующих — expected_mass_range), valid_until (включительно).
#
# Массы — прогон ядра на книге 1.0 после правок F1 (29.09.2026: лимит линий не триггер, лестница по году на отчётном ЧД)
# и пакета аудита (30.09.2026, решения ведущего по аудиту, пп. 1–28; V1.0-CHANGES.md, раздел 6)
# и развёртка по КАЖДОЙ дате оценки с 18.09.2026
# по 30.06.2027 (286 дат; книга без изменений, дата оценки = день такта, миры книжные — как у 850oa). Законно
# ДРЕЙФУЮТ с перекатом даты оценки массы двух гейтов — `ev_ebitda` (знаменатель — EBITDA за 12 месяцев) и
# `terminal_share` (остаток текущего полугодия в EV тает день за днём) — у них `expected_mass_range`; у остальных
# масса на всём отрезке постоянна.
#
# На всей развёртке НЕ срабатывают (записи сняты вместе со скелетом: сработают — сборка остановится и потребует
# текста): `equity_sign` (минимум капитала клетки +39,7 млрд ₽, H × стресс × высокий capex), `interest_cover`
# (минимум покрытия 3,16×, M × стресс × высокий capex), `zero_openings`, `real_rate` (реальная r_u терминала 7,6 / 9,6 / 8,9 % в мирах N / H / M),
# `ev_grows_with_rates`. `credit_lines` у книги «Ленты» не срабатывает по построению: гейт идёт за суждением
# `valuation.distress.credit_limit_trigger` (false с F1 — номинальный лимит «долг + линии» не ограничение пути долга),
# путь против лимита — справка `results.json` → `checks.credit_lines`; запись снята (решение ведущего F1). `margin_range` и `capex_range` тоже не срабатывают, но их записи держат коридоры гейтов.
# Коридоры гейтов margin_range, capex_range и ev_ebitda — поле `corridor` их записей (CONSISTENCY E20): `model/checks.py`
# читает их отсюда (`gate_corridors`), литералов коридоров в коде нет; записи без поля `corridor` у этих гейтов — ошибка сборки.
#
# Срок у всех, кроме `guidance_gap`, — 30.06.2027: объяснения описывают книгу с якорем 1П2026; перезаякоривание на FY2026
# (≈26.03.2027) — новая версия книги, тексты переписываются вместе с ней; будильник сборки напомнит за 30 дней.
#
# Снято относительно 850oa (D4, D16): `sigma_calibration` (σ и K′ нет — метод intrinsic), `creditor_loss`.
# Добавлено: `limited_liability` (совещательный, D4), `guidance_gap` (совещательный, лист «Маржа»).

ev_ebitda:
  # Коридор (лист «Оценка»): миры H и M — 2,5–4,5×, мир N — 3,5–6,0×; только режимы «дно» и «частичная сходимость».
  # История EV/EBITDA «Ленты» (IAS 17, конец года): 2017–2021 3,8–7,2× при ОФЗ 6–10 %; 2022–2025 2,9–5,2×; 18.09.2026 — 3,44× на проформе.
  # С пакетом аудита (30.09.2026) N × дно × высокий capex стоит у края 6,0× (5,99× на дату книги) — 17 клеток из 18;
  # развёртка: 18 клеток 25.09–09.10.2026 и с 14.02.2027 до конца срока.
  explanation: >-
    EV/EBITDA LTM (проформа 88,2 млрд ₽) выходит за коридор в 17 из 18 клеток «дна» и «частичной сходимости» — масса
    0,518 на дату книги (N × дно × высокий capex — 5,99× у края 6,0×; за коридором 25.09–09.10.2026 и с 14.02.2027, масса
    0,540): мир H — 4,9–8,8×, мир M — 5,2–9,0× при коридоре 2,5–4,5×; мир N — 7,5–11,4× при 3,5–6,0×. Рынок и аналоги на
    одной базе IAS 17 — 2,8–3,7× (X5 2,82×, Магнит 3,48×, «Лента» 3,44×). Разрыв — главный спор модели с рынком (V0 против
    V* +57–72 %), а не ошибка: книга ждёт роста EBITDA с 88 до 104–128 млрд ₽ в 2027–2028 гг. (выручка +12–13 % в год —
    открытия «у дома» и LFL; маржа 6,2–7,0 %), поддерживающий capex 1,9–2,4 % выручки (стационар base — середина коридора
    стоимости замещения) и премию r_u над ОФЗ 2,9 п.п. Рынок цену оправдывает только набором неблагоприятных концов сразу
    (β_u 0,70, ERP 6,8 %, дисконт за управление 14 %, capex +0,4 п.п., маржа LT −0,6 п.п. — точка ≈1 590 ₽). Разрыв создают
    четыре бизнес-суждения внутри диапазонов книги (маржа LT, поддерживающий capex, долгий реальный LFL, β_u — аудит
    30.09.2026, attribution-02); вопросы к суждениям — в отчётах первого прогона (I1c), F1 и пакета аудита.
  expected_mass: 0.5176
  expected_mass_range: [0.5176, 0.54]
  valid_until: 2027-06-30
  corridor: {N: [3.5, 6.0], H: [2.5, 4.5], M: [2.5, 4.5]}

capex_range:
  # Коридор (сведение): 1,5–5,5 % выручки — «голодный» capex 2020–2023 1,7–2,0 % и потолок стратегии-2028 5,5 % без M&A.
  explanation: >-
    На книге 1.0 гейт не срабатывает ни на одной дате развёртки 18.09.2026–30.06.2027: capex/выручка полугодий по всем
    36 клеткам — от 1,77 % (M × полная сходимость × низкий capex, 2П2036) до 5,01 % (N × дно × высокий capex, 2П2026),
    внутри коридора 1,5–5,5 %. Запись держит коридор гейта; масса выше 0,02 — тревога сверки массы.
  expected_mass: 0.0
  valid_until: 2027-06-30
  corridor: [0.015, 0.055]

margin_range:
  # Коридор (лист «Маржа»): 4,5–8,0 % EBITDA IAS 17 (история «Ленты» 2013–2026 на общем периметре 5,3–8,2 %).
  explanation: >-
    На книге 1.0 гейт не срабатывает ни на одной дате развёртки 18.09.2026–30.06.2027: маржа полугодий по всем 36 клеткам —
    от 5,18 % (N × стресс, 1П2029 — цель стресса 5,42 % с сезонностью 1П −0,24 п.п.) до 7,94 % (N × полная сходимость, 2П2036 — цель 7,70 % с сезонностью 2П +0,24 п.п.),
    внутри коридора 4,5–8,0 %. Запись держит коридор гейта; масса выше 0,02 — тревога сверки массы.
  expected_mass: 0.0
  valid_until: 2027-06-30
  corridor: [0.045, 0.080]

terminal_share:
  # Коридор 850oa 10–55 % EV. Выше потолка — мир N (реальная r_u терминала 7,6 %) в «полной сходимости»; ниже пола — никого.
  # С пакетом аудита доли ниже на 3–5 п.п.: выручка терминала от площади выхода и доамортизация когорт в налоге терминала
  # сдвигают стоимость в явный период, полугодовая ставка щита — compound.
  explanation: >-
    Доля терминала в EV выше потолка 55 % в клетках мира N с «полной сходимостью» при любом capex (59–60 %), масса 0,032
    (3 клетки). Причина — низкая реальная ставка мира N в терминале (7,6 % против 9,6 % в мире H): при той же марже далёкие
    потоки весят больше. «Дно» и «частичная» мира N — 51–53 % (до пакета аудита — 54–58 %: выручка терминала теперь от
    площади выхода, налог терминала доамортизирует когорты явного периода). Масса дрейфует с датой оценки: 21.12.2026–
    20.01.2027 к ним добавляется N × дно × низкий capex (масса 0,054, 4 клетки), затем снова 3 клетки. Ниже пола 10 % нет ни
    одной клетки (минимум — N × стресс × высокий capex, 13,8 %).
  expected_mass: 0.0315
  expected_mass_range: [0.0315, 0.0539]
  valid_until: 2027-06-30

# ------------------------------------------------------------ совещательные (публикацию не блокируют)

book_update:
  explanation: >-
    Книге больше 45 дней (после 02.11.2026) или кривая ОФЗ сдвинулась на ≥50 б.п. на 5–10 годах против записи 18.09.2026:
    нужна новая версия книги (общая пересборка миров после заседания ЦБ 23.10.2026 — версия 1.1).
  expected_mass: null          # не массовый: флаг выпуска
  valid_until: 2027-06-30

limited_liability:
  # valuation.headline.limited_liability: {v0_to_d_min: 1.3, max_share: 0.10}
  explanation: >-
    Доля прогонов полосы A-V9 с V0 < 1,3·D на книге 1.0 — 0 % из 2 000 (порог 10 %): V0 слоёв на точке 532–555 млрд ₽ против D
    136–137 млрд, V0/D ≈3,9–4,1. Выше порога опционная часть ограниченной ответственности превысила бы шаг печати, и метод
    intrinsic (D4) нужно было бы менять новой версией книги; на книге 1.0 до порога далеко.
  expected_mass: null          # доля прогонов полосы, не масса сетки
  valid_until: 2027-06-30

guidance_gap:
  # Совещательный гейт (решение ведущего C20, `model/checks.py::check_guidance`): в каждой клетке маржа года гайденса =
  # (EBITDA 1П отчётная + EBITDA 2П клетки) / (выручка 1П отчётная + выручка 2П клетки) против facts.guidance; масса — доля
  # сетки, где гайденс не достигается. Расхождение книги с гайденсом записано ДО события; срок — до отчёта за 3 кв. 2026.
  explanation: >-
    Гайденс компании — рентабельность EBITDA не менее 7 % за 2026 год (релиз 02.06.2026) — требует 7,79 % во 2П2026
    на выручке 2П центральной клетки 777,2 млрд ₽ (EBITDA 1П2026 39,28 на 648,49). Ожидание модели на 2П2026 — 6,25 %
    (с затухающим переходным убытком «Дом Ленты»), лучший режим («полная сходимость») — 6,68 %, за год — 6,16 %; гайденс
    не даёт ни один режим. Основание книги: органическое падение маржи унаследованного периметра −0,6…−0,7 п.п. г/г в 1 и
    2 кв. 2026, убыток «Дом Ленты» в период ребрендинга (−28,9 % маржи в 1П2026, в целях — безубыточность «дна»), «О'КЕЙ»
    около безубыточности; 03.08.2026 компания цифру ≥7 % не повторила. Менеджмент выполнял гайденсы 2024–2025 годов —
    поэтому гейт, а не правка книги. Проверка — отчёт за 3 кв. 2026 (≈29.10.2026; ожидание модели на квартал 6,19 %):
    при марже 3 кв. ≥7 % — пересмотр целей «частичного» и «полного» режимов новой версией книги.
  expected_mass: 1.0           # гайденс не достигается ни в одной клетке сетки
  valid_until: 2026-11-03
