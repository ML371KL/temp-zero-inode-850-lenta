# Входы записи для сборки макро-миров — книга-источник (850oa) (WORLDS-RECIPE.md); копия общей записи 18.09.2026 для книги 1.0 «Ленты» (D6).
# Книга 1.4, 24.09.2026: входы 1.3.1 + блок m_inflation и поля ofz_in для расчёта форвардных BEI мира M
# (evidence/book-1.4/worlds); миры N и H — без изменений (воспроизводятся бит в бит).
# `--m-inflation judgement` воспроизводит канон 1.3.1 целиком.
# Всё в % годовых, средние за период, кроме *_eop (конец периода).
# Ярус 1 — входы записи (числа, взятые из опубликованных таблиц и рынка, с датой и источником).
# Ярус 2 — правила вывода якорей (WORLDS-RECIPE.md, раздел 3): применяются инструментом как кандидат
#          и сравниваются с якорями записи; в книге 1.3.1 якоря записи заданы суждением (см. notes_record).
# Ярус 3 — механика (раздел 4): доходности ОФЗ миров, смешивание первого периода, реальные ставки,
#          «справедливые» кривые — считается worlds_recipe.py и обязана воспроизводить worlds_source.json.
version: "1.4"
asof: "2026-09-21"
units: "% p.a.; period averages unless *_eop"
grid:
  first_period: "2026H2"
  n_periods: 21                      # 2026H2 … 2036H2
  first_period_mid_years: 0.03       # лет от даты кривой до середины первого периода (запись 1.3.1: 0,03 ≈ 01.10.2026);
                                     # если поле убрать — считается из дат (середина полугодия − дата кривой)/365,25, не меньше 0

curve:                               # бескупонная кривая ОФЗ (MOEX ISS zcyc), годовое начисление
  source: "MOEX ISS /iss/engines/stock/zcyc.json, снимок reference/market-2026-09-20/zcyc.json"
  date: "2026-09-18"
  nodes: {"0.25": 12.5035, "0.5": 12.8418, "0.75": 13.2245, "1": 13.6044, "2": 14.7953, "3": 15.4849, "5": 16.1386, "7": 16.3780, "10": 16.4551, "15": 16.5136, "20": 16.5808}

ofz_in:                              # ОФЗ-ИН: реальные доходности к погашению на дату кривой (MOEX TQOB), для правила инфляции мира M
  source: "MOEX ISS tqob.json 18.09.2026 (evidence/agent-macro/forwards.py)"
  date: "2026-09-18"                 # книга 1.4: дата доходностей — обязана совпадать с датой кривой (forward_bei)
  settlement_date: "2026-09-21"      # книга 1.4: расчёты T+1 — от этой даты MOEX считает доходность (сверено: YIELDCLOSE воспроизводится ±1 б.п.)
  coupon_pct: 2.5                    # книга 1.4: реальный купон, % годовых от индексируемого номинала (MOEX bondization valueprc)
  coupon_period_days: 182            # книга 1.4: купоны каждые 182 дня назад от погашения (сверено с графиками MOEX всех четырёх выпусков)
  bonds:
    - {secid: "52002", maturity: "2028-02-02", real_yield: 8.78}
    - {secid: "52003", maturity: "2030-07-17", real_yield: 7.20}
    - {secid: "52004", maturity: "2032-03-17", real_yield: 6.99}
    - {secid: "52005", maturity: "2033-05-11", real_yield: 6.31}
  breakeven_cbr_adjusted: {"2028": 5.8, "2030": 7.7, "2032": 9.3}   # рыночная оценка ЦБ (ОФЗ-ИН против ОФЗ-ПД, с поправкой на лаг и сезонность; «Инфляционные ожидания» № 8, август 2026); 7,7 и 9,3 — форварды; НЕ поправка на премии (подпись 1.3.1 была неверной)
  breakeven_naive_forwards: [9.8, 10.1]                             # наивные форвардные BEI 18.09.2026, диапазон

m_inflation:                         # книга 1.4 (решение владельца 24.09.2026): источник инфляции мира M
  source: forward_bei                # judgement — якоря записи 1.3.1 (линейно к pi_ss 9,0, суждение A-M6); forward_bei — рыночные форвардные BEI на дату кривой
  index_lag_months: 3                # лаг индексации номинала ОФЗ-ИН: ИПЦ месяца, отстоящего на три месяца (дневная интерполяция к m−2 — эффективно 2,5–3 мес.)
  smoothing: centered3               # центрированное среднее трёх полугодий — как у ключевой мира M (форварды на полугодовой сетке зубчатые)
  real_interpolation: linear_zero    # реальная кривая между выпусками — линейно по непрерывной ставке, как Curve рецепта (ось: flat_forward)
  real_extrapolation: flat           # реальная кривая за последним выпуском (52005, 05.2033) — постоянная непрерывная ставка, как Curve рецепта (ось: flat_forward)
  lt_window_periods: 6               # pi_ss = среднее полугодовых форвардных BEI за последние 6 периодов сетки (как установившаяся ключевая M), округление 0,1
  first_market_period: "2027H1"      # ИПЦ на конец периода с рынка начиная с 2027H1: окно «год к году» 2026H2 наполовину в прошлом — запись книги
  liquidity_adj_pp: 0.0              # поправка на премию за ликвидность ОФЗ-ИН, п.п. к BEI: 0 = «рынок как есть»; ось суждения 0 … +1,0 (README, раздел 5)
  basis_forward_bei: "форварды кривой ОФЗ 18.09.2026; инфляция — рыночные форвардные BEI той же даты (номинальные форварды zcyc против реальных форвардов ОФЗ-ИН 52002–52005, лаг индексации 3 мес., сглаживание трёх полугодий); ключевая = 6-мес форвард + 0,75 п.п. (0,5 в долгую), сглажено"
  note_forward_bei: "cpi for M = market forward breakevens of 18.09.2026: MOEX zcyc nominal forwards vs OFZ-IN real forwards (52002-52005 bootstrapped with coupons), 3-month index lag, centered 3-half smoothing; long-run = mean 6m forward BEI over the last six grid periods = {pi_ss}% (liquidity adjustment {adj} pp)"

current_key_rate: 14.0             # действующая ключевая ставка на дату входов (ряд cbr.key_rate); текущее полугодие мира M
# current_half_actual: {to: "2026-10-22", avg: 14.0}   # средняя ключевая с начала текущего полугодия по дату — для взвешивания сноски ЦБ (заполнять при 1.4a)

cbr_forecast:                        # среднесрочный прогноз ЦБ (базовый сценарий), опорное заседание
  source: "cbr.ru, «Среднесрочный прогноз Банка России» по итогам заседания 24.07.2026 (evidence/agent-macro/forecast_260724.txt)"
  date: "2026-07-24"
  next_core_meeting: "2026-10-23"
  key_avg: {"2026": [14.5, 14.6], "2027": [10.5, 12.5], "2028": [8.0, 9.0], "2029": [7.5, 8.5]}
  rest_of_year: {from: "2026-07-27", range: [13.7, 14.0]}          # сноска 1: средняя ключевая до конца года
  ytd_avg: {to: "2026-07-26", value: 15.0}                          # сноска 1: средняя с 1 января по дату
  cpi_eop: {"2026": [6.0, 7.0], "2027": 4.0, "2028": 4.0, "2029": 4.0}
  cpi_avg: {"2026": [5.9, 6.2], "2027": [4.3, 5.2], "2028": 4.0, "2029": 4.0}
  neutral_real_rate: {range: [3.5, 4.5], note: "официальная оценка 2026 (медиана семи моделей 4,4 %)"}

ondkp:                               # Основные направления ДКП 2027–2029, проект 31.08.2026 — альтернативные сценарии (годовые средние)
  source: "cbr.ru, ОНДКП 2027–2029 (проект 31.08.2026); внешняя сверка аудита модели 23.09.2026"
  date: "2026-08-31"
  proinflation: {key_avg: {"2027": [13.0, 15.0], "2028": [11.0, 12.0]}, cpi_eop: {}, note: "2029 и инфляция сценария — вписать из итоговой версии ОНДКП (публикуется после 23.10)"}
  risk: {key_avg: {"2027": [19.0, 21.0]}, cpi_eop: {"2027": [11.0, 13.0]}, note: "рисковый сценарий выше форвардов — в сетке нет (кандидат на четвёртый мир, решение 1.4a)"}

survey:                              # макроопрос ЦБ (медианы аналитиков) — вторая опора мира N
  source: "cbr.ru, «Макроэкономический опрос Банка России», 01.09.2026"
  date: "2026-09-01"
  key_avg: {}                        # числа в доказательном листе 1.3.1 не сохранены; вписать при 1.4a (2026, 2027, 2028)
  cpi_eop: {}
  weight_in_N: 0.667                 # правило N: (1 − w)·середина диапазона ЦБ + w·медиана опроса («ближе к опросу»)

minek:                               # прогноз Минэка (вторичные источники) — тарифы, зарплаты, продовольствие
  source: "макропрогноз Минэка (апрель/сентябрь), вторичные источники"
  tariff: {"2026H2": 0.099, "2027": 0.11, "2028": 0.08, "2029": 0.06}
  tariff_lt_over_cpi: 0.015
  tariff_lt_from: 2031

parameters:                          # параметры механики (ярус 3); менять — только новой версией книги
  spread_short_vs_key_pp: -0.5       # короткая ОФЗ против ключевой (норма 2018–2022: −0,3…−1,0)
  tp_shape: {"1": 0.15, "3": 0.67, "5": 0.87, "10": 1.0}   # форма срочной премии по срокам относительно 10 лет (калибровка на кривой 18.09.2026 против пути N)
  first_period_blend_observed: 0.5   # первый период N/H: 50/50 наблюдаемая кривая и модельная; M — наблюдаемая
  m_key_offset_pp: {start: 0.75, steady: 0.5}   # ключевая мира M = 6-мес форвард ОФЗ + надбавка (правило якорей, ярус 2)
  round_decimals: 2

anchor_rules:                        # параметры правил вывода якорей (ярус 2), см. WORLDS-RECIPE.md раздел 3
  key_round_pp: 0.25                 # округление полугодовых ключевых
  cpi_round_pp: 0.1
  h_shift_pp: 1.25                   # H = проинфляционный сценарий ОНДКП + сдвиг на типичную ошибку прогнозов со второго года
  h_shift_from_year_offset: 1
  converge_year: 2031                # год выхода на установившиеся значения (линейно от последнего года таблицы)
  m_cpi_converge_halves: 8           # инфляция M: линейно от eop текущего года к pi_ss за 8 полугодий
  food_spread_lt_pp: {N: 0.3, H: 0.5, M: 0.5}   # продовольственный ИПЦ в долгую = ИПЦ + спред
  real_wage_lt_pct: {N: 2.2, H: 1.9, M: 1.4}    # реальные зарплаты в долгую (номинал = (1+ИПЦ)(1+real) − 1)

worlds:                              # якоря записи (полугодовые; после последнего якоря — установившееся значение steady)
  N:
    name: "Нормализация"
    basis: "среднее между базовым сценарием ЦБ (24.07.2026) и макроопросом аналитиков (01.09.2026), ближе к опросу"
    anchors:
      key:      {"2026H2": 13.9, "2027H1": 13.0, "2027H2": 11.5, "2028H1": 10.25, "2028H2": 9.25, "2029H1": 8.75, "2029H2": 8.25, "2030H1": 8.0, "2030H2": 8.0}
      cpi_eop:  {"2026H2": 6.6, "2027H1": 5.2, "2027H2": 4.5, "2028H1": 4.2, "2028H2": 4.0}
      cpi_avg:  {"2026H2": 6.5, "2027H1": 5.6, "2027H2": 5.0, "2028H1": 4.3, "2028H2": 4.1}
      food_avg: {"2026H2": 5.1, "2027H1": 5.7, "2027H2": 5.0, "2028H1": 4.5, "2028H2": 4.3}
      wage:     {"2026H2": 8.5, "2027H1": 7.8, "2027H2": 7.2, "2028H1": 7.0, "2028H2": 7.0, "2029H1": 6.5, "2029H2": 6.5}
    steady: {key: 8.0, cpi_eop: 4.0, cpi_avg: 4.0, food_avg: 4.3, wage: 6.3}
    tp10_ss_pp: 1.4
    tp_halflife_years: 1.25
    pi_ss: 4.0
    curve_lt: 9.0                    # уровень кривой в терминале (build_assumptions.py LT.curve_lt); правило 1.4a: ОФЗ 10 лет последнего периода с округлением до 0,1 (даёт 8,9 — расхождение записи +0,1)
  H:
    name: "Высокие ставки надолго"
    basis: "проинфляционный сценарий ОНДКП 31.08.2026, сдвинутый вверх на типичную ошибку прогнозов с 2028; инфляция застревает на 5,5 %"
    anchors:
      key:      {"2026H2": 14.0, "2027H1": 14.0, "2027H2": 14.0, "2028H1": 13.0, "2028H2": 12.5, "2029H1": 12.0, "2029H2": 11.5, "2030H1": 11.25, "2030H2": 11.0}
      cpi_eop:  {"2026H2": 7.0, "2027H1": 6.8, "2027H2": 6.5, "2028H1": 6.3, "2028H2": 6.0, "2029H1": 5.7, "2029H2": 5.5}
      cpi_avg:  {"2026H2": 6.6, "2027H1": 6.6, "2027H2": 6.7, "2028H1": 6.4, "2028H2": 6.1, "2029H1": 5.8, "2029H2": 5.6}
      food_avg: {"2026H2": 5.3, "2027H1": 7.0, "2027H2": 7.2, "2028H1": 6.9, "2028H2": 6.6, "2029H1": 6.3, "2029H2": 6.1}
      wage:     {"2026H2": 9.5, "2027H1": 9.5, "2027H2": 9.5, "2028H1": 9.0, "2028H2": 8.6, "2029H1": 8.2, "2029H2": 7.8}
    steady: {key: 10.5, cpi_eop: 5.5, cpi_avg: 5.5, food_avg: 6.0, wage: 7.5}
    tp10_ss_pp: 2.5
    tp_halflife_years: 2.0
    pi_ss: 5.5
    curve_lt: 12.7                   # правило 1.4a даёт 12,6 — расхождение записи +0,1
  M:
    name: "Рыночный как есть"
    basis: "форварды кривой ОФЗ 18.09.2026 и вменённая инфляция ОФЗ-ИН, сглаженная к 9,0 %; ключевая = 6-мес форвард + 0,75 п.п. (0,5 в долгую), сглажено"
    anchors:
      key:      {"2026H2": 14.0, "2027H1": 14.4, "2027H2": 15.9, "2028H1": 16.7, "2028H2": 17.1, "2029H1": 17.4, "2029H2": 17.5, "2030H1": 17.5, "2030H2": 17.5}
      cpi_eop:  {"2026H2": 6.8, "2027H1": 6.0, "2027H2": 5.8, "2028H1": 6.5, "2028H2": 7.3, "2029H1": 8.0, "2029H2": 8.5, "2030H1": 8.8, "2030H2": 9.0}
      cpi_avg:  {"2026H2": 6.5, "2027H1": 6.2, "2027H2": 5.9, "2028H1": 6.2, "2028H2": 6.9, "2029H1": 7.7, "2029H2": 8.3, "2030H1": 8.7, "2030H2": 8.9}
      food_avg: {"2026H2": 5.2, "2027H1": 6.5, "2027H2": 6.3, "2028H1": 6.7, "2028H2": 7.4, "2029H1": 8.2, "2029H2": 8.8, "2030H1": 9.2, "2030H2": 9.4}
      wage:     {"2026H2": 9.0, "2027H1": 8.2, "2027H2": 7.8, "2028H1": 8.0, "2028H2": 8.8, "2029H1": 9.5, "2029H2": 10.0, "2030H1": 10.3, "2030H2": 10.5}
    steady: {key: 17.0, cpi_eop: 9.0, cpi_avg: 9.0, food_avg: 9.5, wage: 10.5}
    pi_ss: 9.0
    curve_lt: 16.7

probabilities: {N: 0.35, H: 0.45, M: 0.20}           # аналитические веса — суждение (книга, A-P1); не выводятся правилом
probability_ranges: {N: [0.25, 0.40], H: [0.40, 0.50], M: [0.15, 0.25]}

notes:                               # переносятся в worlds_source.json как есть
  - "key_avg = average key rate in period"
  - "ofz_* for N/H = perfect-foresight mean of (key-0.5pp) over tenor + term premium decaying from today-implied to steady state (N: 1.4pp, half-life 1.25y; H: 2.5pp, half-life 2y); 2026H2 blended 50/50 with observed curve of 18.09.2026"
  - "ofz_* for M = forward zero yields from MOEX zcyc 18.09.2026 as is; key for M = 6m forward OFZ + 0.75pp (0.5pp in steady state)"
  - "cpi for M = OFZ-IN breakevens (CBR-adjusted estimates 5.8/7.7/9.3 and naive 18.09.2026 forwards 9.8-10.1) smoothed to 9.0"

notes_record:
  - "Якоря записи 1.3.1 заданы суждением по источникам из basis; правила яруса 2 формализованы 23.09.2026 и применяются впервые в 1.4a — инструмент печатает кандидатов рядом с якорями записи."
  - "curve_lt N/H в записи на 0,1 п.п. выше правила «ОФЗ 10 лет последнего периода»; разрешить в 1.4a."
