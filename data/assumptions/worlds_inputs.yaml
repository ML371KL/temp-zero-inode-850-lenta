# Входы записи для сборки макро-миров — книга-источник (850oa) (WORLDS-RECIPE.md); копия общей записи 28.10.2026 для книги 1.2 «Ленты» (D6).
# Книга 1.7, 29.10.2026: пересборка миров после решения Банка России 23.10.2026 (лист evidence/book-1.7/worlds):
# прогноз ЦБ 23.10, итоговая ОНДКП 28.10, макроопрос 14.10, рыночный снимок мира M — окно 23–28.10.2026;
# якоря N, H и ключевой M — выход правил яруса 2 (раздел 3) без суждения поверх; второй заход 29.10 — продовольствие и
# зарплаты текущего полугодия по факту, средний ИПЦ H по концам периода. Канон 1.4 (запись 18.09.2026)
# — evidence/book-1.7/worlds/canon-1.4/: рецепт 1.7 воспроизводит его бит в бит (новые правила — только ключами).
# Всё в % годовых, средние за период, кроме *_eop (конец периода).
# Ярус 1 — входы записи (числа, взятые из опубликованных таблиц и рынка, с датой и источником).
# Ярус 2 — правила вывода якорей (WORLDS-RECIPE.md, раздел 3): candidate_anchors(); с 1.7 якоря записи = правила.
# Ярус 3 — механика (раздел 4): доходности ОФЗ миров, смешивание первого периода, реальные ставки,
#          «справедливые» кривые — считается worlds_recipe.py и обязана воспроизводить worlds_source.json.
version: "1.7"
asof: "2026-10-28"
units: "% p.a.; period averages unless *_eop"
grid:
  first_period: "2026H2"
  n_periods: 21                      # 2026H2 … 2036H2
                                     # first_period_mid_years не задан (1.7): mid_0 считается из дат —
                                     # (01.10.2026 − 28.10.2026)/365,25 < 0 → 0

curve:                               # бескупонная кривая ОФЗ (MOEX ISS zcyc), годовое начисление
  source: "MOEX ISS /iss/engines/stock/zcyc.json?date=, кривая на конец дня (18:54), среднее узлов по дням окна 23–28.10.2026 (evidence/book-1.7/worlds/data, window.py)"
  date: "2026-10-28"                 # дата снимка — последний день окна
  nodes: {"0.25": 13.0946, "0.5": 13.4529, "0.75": 13.7719, "1": 14.0605, "2": 14.9502, "3": 15.5131, "5": 16.0902, "7": 16.3335, "10": 16.4854, "15": 16.5755, "20": 16.6101}
  window:                            # книга 1.7 (решение ведущего 29.10.2026): снимок мира M — окно дней (WORLDS-RECIPE.md, раздел 2.1)
    rule: "до 10 торговых дней по дату снимка, но не раньше дня последнего решения Банка России по ключевой ставке; если таких дней меньше трёх, снимок ждёт третьего торгового дня после решения"
    last_decision: "2026-10-23"      # решение Совета директоров Банка России по ключевой ставке 23.10.2026 (сохранена 14,00 %)
    max_days: 10
    min_days: 3
    method: "среднее по дням окна обеих сторон: узлы бескупонной кривой MOEX zcyc на конец дня и реальные доходности ОФЗ-ИН 52002–52005 (YIELDCLOSE истории TQOB), округление 0,0001; дата снимка — последний день окна"
    days:                            # узлы zcyc дня, % годовых (data/zcyc_<день>.json)
      "2026-10-23": {"0.25": 13.4726, "0.5": 13.7364, "0.75": 13.977, "1": 14.2056, "2": 14.9727, "3": 15.5117, "5": 16.132, "7": 16.431, "10": 16.635, "15": 16.7728, "20": 16.8328}
      "2026-10-26": {"0.25": 12.9779, "0.5": 13.382, "0.75": 13.7377, "1": 14.0534, "2": 14.9926, "3": 15.5625, "5": 16.1339, "7": 16.3708, "10": 16.5148, "15": 16.6067, "20": 16.6449}
      "2026-10-27": {"0.25": 13.0923, "0.5": 13.431, "0.75": 13.7347, "1": 14.0112, "2": 14.8745, "3": 15.4329, "5": 16.0268, "7": 16.2829, "10": 16.4348, "15": 16.5247, "20": 16.5599}
      "2026-10-28": {"0.25": 12.8358, "0.5": 13.2624, "0.75": 13.6382, "1": 13.972, "2": 14.9611, "3": 15.5455, "5": 16.0679, "7": 16.2494, "10": 16.3568, "15": 16.398, "20": 16.403}

ofz_in:                              # ОФЗ-ИН: реальные доходности к погашению (MOEX TQOB), вход инфляции мира M (forward_bei)
  source: "MOEX ISS /iss/history/engines/stock/markets/bonds/boards/TQOB/securities/{secid}.json, YIELDCLOSE, среднее по дням окна 23–28.10.2026 (evidence/book-1.7/worlds/data)"
  date: "2026-10-28"                 # дата доходностей — обязана совпадать с датой кривой (forward_bei)
  settlement_date: "2026-10-29"      # расчёты T+1 от даты снимка
  coupon_pct: 2.5                    # реальный купон, % годовых от индексируемого номинала (MOEX bondization valueprc)
  coupon_period_days: 182            # купоны каждые 182 дня назад от погашения (сверено с графиками MOEX, книга 1.4)
  bonds:
    - {secid: "52002", maturity: "2028-02-02", real_yield: 8.965}
    - {secid: "52003", maturity: "2030-07-17", real_yield: 6.815}
    - {secid: "52004", maturity: "2032-03-17", real_yield: 6.39}
    - {secid: "52005", maturity: "2033-05-11", real_yield: 6.165}
  window:                            # книга 1.7: YIELDCLOSE по дням окна, % (data/ofzin_history_<SECID>.json); дни те же, что у кривой
    days:
      "2026-10-23": {"52002": 8.92, "52003": 6.73, "52004": 6.4, "52005": 6.12}
      "2026-10-26": {"52002": 8.98, "52003": 6.8, "52004": 6.46, "52005": 6.13}
      "2026-10-27": {"52002": 8.86, "52003": 6.82, "52004": 6.34, "52005": 6.31}
      "2026-10-28": {"52002": 9.1, "52003": 6.91, "52004": 6.36, "52005": 6.1}
  breakeven_cbr_adjusted: {"2028": 5.8, "2030": 7.7, "2032": 9.3}   # только для сверки: рыночная оценка ЦБ за 1–21.08.2026 («Инфляционные ожидания» № 8), в 1.7 не обновлялась; 7,7 и 9,3 — форварды

m_inflation:                         # книга 1.4 (решение владельца 24.09.2026): источник инфляции мира M
  source: forward_bei                # judgement — якоря записи 1.3.1 (линейно к pi_ss 9,0, суждение A-M6); forward_bei — рыночные форвардные BEI на дату кривой
  index_lag_months: 3                # лаг индексации номинала ОФЗ-ИН: ИПЦ месяца, отстоящего на три месяца
  smoothing: centered3               # центрированное среднее трёх полугодий — как у ключевой мира M
  real_interpolation: linear_zero    # реальная кривая между выпусками — линейно по непрерывной ставке (ось: flat_forward)
  real_extrapolation: flat           # реальная кривая за последним выпуском (52005, 05.2033) — постоянная непрерывная ставка (ось: flat_forward)
  lt_window_periods: 6               # pi_ss = среднее полугодовых форвардных BEI за последние 6 периодов сетки, округление 0,1
  first_market_period: "2027H1"      # ИПЦ с рынка начиная с 2027H1: окно «год к году» 2026H2 наполовину в прошлом — запись книги
  liquidity_adj_pp: 0.0              # поправка на премию за ликвидность ОФЗ-ИН, п.п. к BEI: 0 = «рынок как есть»
  basis_forward_bei: "форварды кривой ОФЗ — среднее окна 23–28.10.2026 после решения Банка России 23.10; инфляция — рыночные форвардные BEI того же окна (номинальные форварды zcyc против реальных форвардов ОФЗ-ИН 52002–52005, обе стороны — средние по дням, лаг индексации 3 мес., сглаживание трёх полугодий); ключевая = 6-мес форвард + 0,75 п.п. (0,5 в долгую), сглажено"
  note_forward_bei: "cpi for M = market forward breakevens, window 23-28.10.2026 (mean of daily MOEX zcyc nominal nodes and OFZ-IN real yields 52002-52005, bootstrapped with coupons), 3-month index lag, centered 3-half smoothing; long-run = mean 6m forward BEI over the last six grid periods = {pi_ss}% (liquidity adjustment {adj} pp)"

curve_lt_source: rule                # книга 1.7: уровень кривой в терминале всех миров — правило «ОФЗ 10 лет последнего периода, 0,1» (блок curve_lt записи)

current_key_rate: 14.0               # действующая ключевая ставка на дату снимка (cbr.ru/hd_base/KeyRate: 14,00 с 27.07.2026); текущее полугодие мира M
current_half_actual: {to: "2026-10-28", avg: 14.0542}   # средняя ключевая 01.07–28.10.2026 по календарным дням: 14,25 по 26.07 (26 дн.), 14,00 с 27.07 (94 дн.); data/cbr_keyrate_2026-06-01_2026-10-28.html

cpi_actual:                          # книга 1.7: ИПЦ г/г по месяцам — средний ИПЦ текущего полугодия по факту (WORLDS-RECIPE.md, раздел 3)
  source: "cbr.ru/hd_base/infl («Инфляция и ключевая ставка Банка России», данные Росстата), снято 29.10.2026; октябрь не опубликован (data/cbr_infl_2025-01_2026-10.html)"
  yoy: {"2026-07": 5.98, "2026-08": 6.33, "2026-09": 6.35}
  food_spread:                       # книга 1.7, второй заход (решение ведущего 29.10.2026): продовольственный ИПЦ текущего полугодия = средний ИПЦ мира + фактический спред
    source: "cbr.ru/analytics/dkp/dinamic/CPD_2026-9/ («Динамика потребительских цен», сентябрь 2026), оба ряда — одна таблица; снято 29.10.2026 (data/cbr_cpd_2026-09.html, facts.py)"
    food_yoy: {"2026-07": 4.4, "2026-08": 5.1, "2026-09": 5.1}   # продовольственные товары, % г/г
    all_yoy: {"2026-07": 6.0, "2026-08": 6.3, "2026-09": 6.4}    # все товары и услуги, % г/г; спред = 4,867 − 6,233 = −1,367 п.п.

wage_actual:                         # книга 1.7, второй заход (решение 29.10.2026): номинальные зарплаты г/г текущего полугодия — опубликованные месяцы по факту, остальные — правило мира
  source: "Росстат, «Среднемесячная номинальная начисленная заработная плата работников в целом по экономике РФ в 1991–2026 гг.», tab1-zpl_08-2026.xlsx (rosstat.gov.ru/storage/mediabank/), снято 29.10.2026: июль 109 524 / 99 305 ₽, август 103 014 / 92 866 ₽ (2026 / 2025; август — оценка Росстата); data/rosstat_tab1-zpl_08-2026.xlsx, facts.py"
  yoy: {"2026-07": 10.29, "2026-08": 10.93}

cbr_forecast:                        # среднесрочный прогноз ЦБ (базовый сценарий), опорное заседание
  source: "cbr.ru, «Среднесрочный прогноз Банка России по итогам заседания Совета директоров по ключевой ставке 23 октября 2026 года» (forecast_261023.pdf, с. 1, sha256 0e007c6d…; data/cbr_forecast_2026-10-23.txt); те же числа — табл. 3.2 итоговой ОНДКП 28.10.2026 (с. 73 PDF)"
  date: "2026-10-23"
  next_core_meeting: "2027-02"
  key_avg: {"2026": 14.6, "2027": [12.5, 13.5], "2028": [9.0, 10.0], "2029": [7.5, 8.5]}
  rest_of_year: {from: "2026-10-26", range: [14.0, 14.0]}          # сноска 1: средняя ключевая с 26.10 до конца года
  ytd_avg: {to: "2026-10-25", value: 14.7}                          # сноска 1: средняя с 1 января по 25.10
  cpi_eop: {"2026": [7.1, 7.6], "2027": 4.0, "2028": 4.0, "2029": 4.0}
  cpi_avg: {"2026": [6.2, 6.3], "2027": [5.2, 5.7], "2028": 4.0, "2029": 4.0}
  neutral_real_rate: {range: [3.5, 4.5], note: "итоговая ОНДКП 28.10.2026, с. 71 PDF: долгосрочная реальная нейтральная «остается на уровне 3,5–4,5%» (номинальная 7,5–8,5 %)"}

ondkp:                               # ОНДКП 2027–2029, ИТОГОВАЯ версия 28.10.2026 — альтернативные сценарии (годовые средние)
  source: "cbr.ru/about_br/publ/ondkp/on_2027_2029/, итоговая версия 28.10.2026 (on_2027(2028-2029).pdf, sha256 7e3b29af…): табл. 3.3 «Дезинфляционный» (с. 77 PDF / 75 печ.), 3.4 «Проинфляционный» (с. 81 / 79), 3.5 «Рисковый» (с. 85 / 83); data/ondkp_final_2026-10-28_excerpt.txt. Проекты: первый — 31.08.2026, второй — 30.09.2026 (одобрен СД 29.09, sha256 3c3270ef…; data/ondkp_draft_2026-09-30_excerpt.txt)"
  date: "2026-10-28"
  proinflation: {key_avg: {"2027": [14.0, 16.0], "2028": [11.5, 12.5], "2029": [8.5, 9.5]}, cpi_eop: {"2027": [4.5, 5.5], "2028": 4.0, "2029": 4.0}, cpi_avg: {"2027": [5.2, 6.2], "2028": [4.0, 4.5], "2029": 4.0}}
  risk: {key_avg: {"2027": [19.0, 21.0], "2028": [14.0, 16.0], "2029": [9.5, 10.5]}, cpi_eop: {"2027": [11.0, 13.0], "2028": [5.0, 7.0], "2029": 4.0}, cpi_avg: {"2027": [8.1, 9.7], "2028": [9.3, 11.4], "2029": [3.6, 4.4]}, note: "рисковый сценарий выше мира M только в 2027 году — четвёртого мира нет (решение 27.10.2026)"}
  disinflation: {key_avg: {"2027": [10.0, 12.0], "2028": [7.5, 8.5], "2029": [7.5, 8.5]}, cpi_eop: {"2027": [3.0, 4.0], "2028": 4.0, "2029": 4.0}}
  draft_2026_09_30: {proinflation_key_avg: {"2027": [13.0, 15.0], "2028": [11.0, 12.0], "2029": [8.5, 9.5]}, note: "проект 30.09 (числа ключевой — те же, что в проекте 31.08); правило перепроверки 5.5: середина проинфляционного 2027 14,0 → 15,0 (+1,0 п.п.), 2028 11,5 → 12,0 (+0,5) — сдвиг ≥ 0,5 п.п., мир H — по итоговой"}

survey:                              # макроопрос ЦБ (медианы аналитиков) — вторая опора мира N
  source: "cbr.ru, «Макроэкономический опрос Банка России», октябрь 2026 (опрос 9–13.10, опубликован 14.10.2026; медианы 32 экономистов), survey.pdf с. 1–2, sha256 d0f10171…; data/survey_2026-10-14_p1-3.txt"
  date: "2026-10-14"
  key_avg: {"2026": 14.6, "2027": 12.8, "2028": 10.8, "2029": 9.2}   # в скобках опроса — сентябрь: 14,5 / 12,4 / 10,0 / 8,6
  cpi_eop: {"2026": 7.1, "2027": 5.0, "2028": 4.2, "2029": 4.0}
  cpi_avg: {"2026": 6.2, "2027": 5.8, "2028": 4.5, "2029": 4.0}
  weight_in_N: 0.667                 # правило N: (1 − w)·середина диапазона ЦБ + w·медиана опроса («ближе к опросу») — ставка и с 1.7 ИПЦ
  neutral: 8.5                       # нейтральная ключевая аналитиков (с. 2; сентябрь 8,0; центральные 10–90 % — 7,4–9,6) — справочно

minek:                               # прогноз Минэка (вторичные источники) — тарифы, зарплаты, продовольствие; в 1.7 не менялся
  source: "макропрогноз Минэка (апрель/сентябрь), вторичные источники"
  tariff: {"2026H2": 0.099, "2027": 0.11, "2028": 0.08, "2029": 0.06}
  tariff_lt_over_cpi: 0.015
  tariff_lt_from: 2031

parameters:                          # параметры механики (ярус 3); менять — только новой версией книги
  spread_short_vs_key_pp: -0.5       # короткая ОФЗ против ключевой (норма 2018–2022: −0,3…−1,0)
  tp_shape: {"1": 0.15, "3": 0.67, "5": 0.87, "10": 1.0}   # форма срочной премии по срокам относительно 10 лет (калибровка на кривой 18.09.2026 против пути N)
  first_period_blend_observed: 0.5   # первый период N/H: 50/50 наблюдаемая кривая и модельная; M — наблюдаемая
  m_key_offset_pp: {start: 0.75, steady: 0.5}   # ключевая мира M = 6-мес форвард ОФЗ + надбавка (правило якорей, ярус 2)
  round_decimals: 2

anchor_rules:                        # параметры правил вывода якорей (ярус 2), см. WORLDS-RECIPE.md раздел 3
  key_round_pp: 0.25                 # округление полугодовых ключевых
  cpi_round_pp: 0.1
  h_shift_pp: 1.25                   # H = проинфляционный сценарий ОНДКП + сдвиг на типичную ошибку прогнозов со второго года
  h_shift_from_year_offset: 1
  converge_year: 2031                # год выхода на установившиеся значения (линейно от последнего года таблицы)
  m_cpi_converge_halves: 8           # инфляция M в режиме judgement: линейно от eop текущего года к pi_ss за 8 полугодий
  food_spread_lt_pp: {N: 0.3, H: 0.5, M: 0.5}   # продовольственный ИПЦ в долгую = ИПЦ + спред
  real_wage_lt_pct: {N: 2.2, H: 1.9, M: 1.4}    # реальные зарплаты в долгую (номинал = (1+ИПЦ)(1+real) − 1)
  h_key_rule: monotone               # книга 1.7: ключевая H — сценарий + сдвиг, пока не ниже установившейся, далее линейно к ней; первый полный год ровно
  h_cpi_rule: cbr_upper_linear       # книга 1.7: ИПЦ H — от верхней границы диапазона ЦБ текущего года линейно к 5,5 к 2031; ИПЦ сценария ОНДКП — только сверка
  n_cpi_survey_blend: true           # книга 1.7: ИПЦ N на конец года и средний — тот же вес опроса (2/3), что у ставки, по годам
  h_cpi_avg_rule: eop_mid            # книга 1.7, второй заход: средний ИПЦ H = середина ИПЦ H на конец предыдущего и текущего полугодия (после текущего)

worlds:                              # якоря записи (полугодовые; после последнего якоря — установившееся значение steady)
  N:
    name: "Нормализация"
    basis: "базовый сценарий ЦБ (23.10.2026) и макроопрос аналитиков (14.10.2026) с весом опроса 2/3 — ключевая и ИПЦ; текущее полугодие ИПЦ — факт июля–сентября и путь к концу года"
    anchors:                         # 1.7: выход правил яруса 2 (candidate_anchors) без суждения поверх
      key:      {"2026H2": 14.05, "2027H1": 13.25, "2027H2": 12.5, "2028H1": 11.0, "2028H2": 9.75, "2029H1": 9.0, "2029H2": 8.5, "2030H1": 8.5, "2030H2": 8.25, "2031H1": 8.0, "2031H2": 8.0}
      cpi_eop:  {"2026H2": 7.2, "2027H1": 5.9, "2027H2": 4.7, "2028H1": 4.4, "2028H2": 4.1, "2029H1": 4.1, "2029H2": 4.0}
