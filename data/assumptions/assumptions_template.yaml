  note: "правило, заданное до подсчёта: P = w_I·P_I + w_E·P_E; Лаплас ½ в каждом классе; w_I 0,664 — доля падения маржи 2025 → проформа 1П2026 без переходного убытка «Дом Ленты» (0,32 п.п. вне уровня режимов, C17), объяснённая составом периметра (0,85 из 1,28 п.п.); случаи класса C в классе I — с весом ½. Класс E: n 10, исходы 50/30/20/0 %, с Лапласом 45,8/29,2/20,8/4,2 %. Класс I: X5 — «Копейка» 2010 (дно), Магнит — «Дикси» 2021 (стресс), Лента — Billa 2021 (частичная, C); с Лапласом 33,3/33,3/22,2/11,1 %. Класс I мал; «Копейка» по полному окну T0+3…T0+4 (7,17 и 7,23 % → 7,20 %) — f +0,20, «дно» (порог «частичного» 0,25); цензурированы «Улыбка», «Молния», «Реми», «Азбука вкуса»; «Монетка» — без разбавления; «Карусель» — двойной счёт с эпизодом X5 2008; публичные отчётные данные аналогов со ссылкой на первоисточник (решение ведущего F33)"
