  macro_neutral_world: M                              # A-P1n (решение): низ оси ставок — мир M с безусловными вероятностями режимов и capex
  own_macro_confidence: 0.5                           # A-P1c (решение): λ; точка = низ + λ·(верх − низ); ползунок витрины
  regime_given_world:                                 # A-P2 (правило двух классов, задано до подсчёта): P = w_I·P_интеграции + w_E·P_эпизоды, Лаплас ½; w_I 0,664 — доля падения маржи 2025 → проформа 1П2026 в годовом уровне без переходного убытка «Дом Ленты» (решение ведущего по аудиту 30.09.2026, п. 19), объяснённая составом периметра (0,85 из 1,28 п.п.); сведение 37,5 / 31,9 / 21,8 / 8,8 % → 37 / 32 / 22 / 9; одна строка во всех мирах; E[m_LT] 6,33 %
    N: {stress: 0.37, floor: 0.32, partial: 0.22, full: 0.09}
    H: {stress: 0.37, floor: 0.32, partial: 0.22, full: 0.09}
    M: {stress: 0.37, floor: 0.32, partial: 0.22, full: 0.09}
  capex_prob_given_regime:                            # A-P3: конструкция 850oa; стресс сдвинут к low по истории «Ленты» (2019–2020 «строгий контроль capex», 2022–2023 capex 1,7–2,0 % на дне маржи)
    stress:  {low: 0.35, base: 0.50, high: 0.15}
    floor:   {low: 0.20, base: 0.60, high: 0.20}
    partial: {low: 0.20, base: 0.60, high: 0.20}
    full:    {low: 0.15, base: 0.60, high: 0.25}
  growth_by_regime_override: {stress: low}            # A-P4g: в стрессе во всех мирах площадь по пути low (копия 850oa; лист «Сеть»)
  by_world:                                           # A-P4: к миру привязаны рост сети (юнит-экономика зависит от ставок) и кредитный спред; ОК — hold везде (лист nwc-tax)
    N: {growth: high, nwc: hold, credit: base}
    H: {growth: mid, nwc: hold, credit: base}
    M: {growth: low, nwc: hold, credit: stress}
  demand_by_regime: {stress: bear, floor: base, partial: base, full: bull}   # копия 850oa: состояние спроса (k, s, трафик) — по режиму маржи
  regime_update:                                      # A-P2u: механика 850oa; P(режим | наблюдения) ∝ P(режим)·N(отклонение; 0, σ²), отклонения — AR(1) с ρ = margin.deviation_persistence; у наблюдения с ошибкой — к дисперсии + se² (правило ядра)
    sigma_pp: 0.007                                   # СТАЦИОНАРНОЕ sd отклонения от цели; инновация σ·√(1 − ρ²) = 0,61 п.п.; медиана оценок: «Лента» на общем периметре 1,40 (робастно 0,39), Магнит 0,74, X5 0,63 (ar1.py)
    sigma_range: [0.005, 0.010]
    max_shift_pp: 0.10                                # как 850oa; режимы во 2П2026 различаются сильнее (свой путь унаследованного периметра) — у крайних фактов предел сдвига срабатывает
    # сжатия ближних целей нет (s = 1): правило 850oa выведено из σ_EV, которой при внутренней стоимости нет (D9); ключа near_target_shrink
    # нет — ядро его не читает, цели хранятся несжатыми (выбор и тест мартингала — V1.0-CHANGES.md); дрейф E[m_LT] после отчёта без предела 0 б.п., с пределом сдвига −1,4 б.п.
    # наблюдение якоря — facts.anchor.margin_pro_forma/_se (проформа 5,74 %, se 0,10 п.п.; ядро берёт его оттуда, второй раз в observations
    # его писать нельзя): цели "2026H1" равны у всех режимов → вероятности не сдвигает; отклонение −0,32 п.п. — переходный убыток DIY
    observations: {}
    demo_period: "2026H2"                             # D2: годовой отчёт ≈26.03.2027 (2П = год − 1П)
    demo_values: [0.050, 0.055, 0.060, 0.065, 0.070, 0.075, 0.080]   # ожидание модели 6,25 % (с затухающим отклонением якоря), нейтральная ≈6,25 % (в пространстве E[m_LT]); гайденс ≥7 % за 2026 требует 7,79 % во 2П

